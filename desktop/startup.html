<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThuisHub starten</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #f5f7f8;
        background:
          radial-gradient(circle at 50% 110%, rgba(53, 212, 210, .13), transparent 38%),
          radial-gradient(circle at 12% 85%, rgba(184, 255, 44, .08), transparent 28%),
          #020a11;
      }
      main { display: grid; justify-items: center; gap: 18px; text-align: center; }
      .brand { display: flex; align-items: center; gap: 13px; font-size: 28px; font-weight: 800; letter-spacing: -.7px; }
      .mark {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(184, 255, 44, .4);
        border-radius: 15px;
        color: #b8ff2c;
        background: rgba(184, 255, 44, .08);
        box-shadow: 0 0 32px rgba(184, 255, 44, .1);
        font-size: 30px;
      }
      .spinner {
        width: 34px;
        height: 34px;
        margin-top: 9px;
        border: 3px solid rgba(169, 183, 192, .18);
        border-top-color: #b8ff2c;
        border-right-color: #35d4d2;
        border-radius: 50%;
        animation: spin .75s linear infinite;
      }
      h1 { margin: 0; font-size: 20px; line-height: 1.3; }
      p { margin: -8px 0 0; color: #8fa0aa; font-size: 14px; }
      .version { position: fixed; right: 22px; bottom: 17px; color: #536772; font-size: 12px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.8s; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark" aria-hidden="true">⌂</span><span>ThuisHub</span></div>
      <div class="spinner" role="status" aria-label="ThuisHub wordt gestart"></div>
      <h1 id="status">ThuisHub wordt gestart</h1>
      <p>Je bibliotheek en instellingen worden klaargezet…</p>
    </main>
    <span class="version" id="version"></span>
    <script>
      const params = new URLSearchParams(location.search);
      if (params.get('updated') === '1') document.querySelector('#status').textContent = 'Update geïnstalleerd — ThuisHub starten';
      const version = params.get('version');
      if (version) document.querySelector('#version').textContent = `Versie ${version}`;
    </script>
  </body>
</html>
